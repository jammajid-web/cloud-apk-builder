
name: ChatWave Flutter Android Build

on:
  push:
    branches:
      - main
      - flutter-app
  pull_request:
    branches:
      - main
      - flutter-app
  workflow_dispatch:

jobs:
  build:
    name: Build ChatWave APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android Platform
        run: flutter create --platforms=android --org com.chatwave --project-name chatwave .

      - name: Install Dependencies
        run: flutter pub get

      - name: Analyze Flutter Code
        run: flutter analyze

      - name: Run Tests
        run: flutter test

      - name: Build Debug APK
        run: |
          flutter build apk --debug \
            --dart-define=SUPABASE_URL="${{ secrets.SUPABASE_URL }}" \
            --dart-define=SUPABASE_PUBLISHABLE_KEY="${{ secrets.SUPABASE_PUBLISHABLE_KEY }}"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatWave-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
