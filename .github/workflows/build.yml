
name: Advanced Cloud APK Builder

run-name: APK Builder - ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Builder request ID
        required: true
        type: string
      release_tag:
        description: GitHub draft release tag
        required: true
        type: string
      manifest_json:
        description: Builder configuration JSON
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-builder-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        id: config
        env:
          MANIFEST_JSON: ${{ inputs.manifest_json }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os, re, sys

          try:
              m = json.loads(os.environ["MANIFEST_JSON"])
          except Exception as e:
              sys.exit("Invalid manifest JSON: " + str(e))

          def get(*keys, default=""):
              for key in keys:
                  if m.get(key) not in (None, ""):
                      return m[key]
              return default

          name = str(get("app_name", "APP_NAME")).strip()
          package = str(get("package_id", "PACKAGE_ID")).strip()
          version = str(get("version", "APP_VERSION", default="1.0.0")).strip()
          code = str(get("version_code", "VERSION_CODE", default="1")).strip()

          if not name or len(name) > 80:
              sys.exit("Invalid app name.")

          if not re.fullmatch(r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+", package):
              sys.exit("Invalid Android package ID.")

          if not re.fullmatch(r"[A-Za-z0-9._+-]+", version):
              sys.exit("Invalid version name.")

          if not code.isdigit() or int(code) < 1:
              sys.exit("Invalid version code.")

          backend = m.get("backend") or {}
          provider = backend.get("provider", "none")

          if provider not in ("none", "supabase", "firebase"):
              sys.exit("Unsupported backend provider.")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("app_name=" + name.replace("%", "%25").replace("\n", "%0A") + "\n")
              f.write("package_id=" + package + "\n")
              f.write("version=" + version + "\n")
              f.write("version_code=" + code + "\n")
              f.write("backend=" + provider + "\n")
          PY

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Download project ZIP from GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')
          ASSET_ID=$(echo "$RELEASE" | jq -r '.assets[] | select(.name=="source.zip") | .id')

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "null" ] || [ -z "$ASSET_ID" ]; then
            echo "Source ZIP was not found in the draft release."
            exit 1
          fi

          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/$REPO/releases/assets/$ASSET_ID" \
            -o source.zip

          test -s source.zip

      - name: Safely extract project ZIP
        run: |
          python3 - <<'PY'
          import zipfile, os, shutil, sys

          archive = "source.zip"
          destination = "source"

          shutil.rmtree(destination, ignore_errors=True)
          os.makedirs(destination, exist_ok=True)

          max_total = 400 * 1024 * 1024
          total = 0

          with zipfile.ZipFile(archive) as z:
              for item in z.infolist():
                  name = item.filename.replace("\\", "/")
                  parts = name.split("/")

                  if name.startswith("/") or ".." in parts:
                      sys.exit("Unsafe ZIP path detected.")

                  if item.external_attr >> 28 == 0xA:
                      sys.exit("Symbolic links are not allowed.")

                  total += item.file_size
                  if total > max_total:
                      sys.exit("Extracted project exceeds 400 MB.")

              z.extractall(destination)

          print("Project extracted safely.")
          PY

      - name: Detect project type
        id: project
        run: |
          set -euo pipefail

          ROOT="source"

          if [ -f "$ROOT/gradlew" ]; then
            echo "type=native" >> "$GITHUB_OUTPUT"
            echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          else
            INDEX=$(find "$ROOT" -maxdepth 4 -type f -name index.html | head -n 1)

            if [ -z "$INDEX" ]; then
              echo "No index.html or native Gradle project was found."
              exit 1
            fi

            WEB_ROOT=$(dirname "$INDEX")
            echo "type=web" >> "$GITHUB_OUTPUT"
            echo "root=$WEB_ROOT" >> "$GITHUB_OUTPUT"
          fi

      - name: Prepare Capacitor web project
        if: steps.project.outputs.type == 'web'
        env:
          APP_NAME: ${{ steps.config.outputs.app_name }}
          PACKAGE_ID: ${{ steps.config.outputs.package_id }}
          APP_VERSION: ${{ steps.config.outputs.version }}
          VERSION_CODE: ${{ steps.config.outputs.version_code }}
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        run: |
          set -euo pipefail

          mkdir -p project/www
          cp -R "${{ steps.project.outputs.root }}/." project/www/

          cd project

          npm init -y
          npm install @capacitor/core@6 @capacitor/android@6
          npm install --save-dev @capacitor/cli@6

          python3 - <<'PY'
          import json, os

          config = {
              "appId": os.environ["PACKAGE_ID"],
              "appName": os.environ["APP_NAME"],
              "webDir": "www",
              "plugins": {
                  "SplashScreen": {
                      "launchShowDuration": 2500,
                      "launchAutoHide": True,
                      "backgroundColor": "#ffffff",
                      "showSpinner": False,
                      "androidScaleType": "CENTER_INSIDE"
                  }
              }
          }

          with open("capacitor.config.json", "w") as f:
              json.dump(config, f, indent=2)
          PY

          npx cap add android

      - name: Install AdMob plugin
        if: steps.project.outputs.type == 'web'
        env:
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        run: |
          python3 - <<'PY'
          import json, os
          m = json.loads(os.environ["MANIFEST_JSON"])
          admob = m.get("admob") or {}
          enabled = str(admob.get("enabled", False)).lower() in ("true", "1", "yes")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("enabled=" + str(enabled).lower() + "\n")
          PY
        id: admob

      - name: Add AdMob Capacitor dependency
        if: steps.project.outputs.type == 'web' && steps.admob.outputs.enabled == 'true'
        working-directory: project
        run: npm install @capacitor-community/admob@6

      - name: Configure backend and AdMob runtime
        if: steps.project.outputs.type == 'web'
        env:
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        working-directory: project
        run: |
          python3 - <<'PY'
          import json, os, pathlib

          m = json.loads(os.environ["MANIFEST_JSON"])
          backend = m.get("backend") or {}
          provider = backend.get("provider", "none")

          config = {
              "provider": provider,
              "supabase": backend.get("supabase", {}),
              "firebase": backend.get("firebase", {})
          }

          www = pathlib.Path("www")
          www.mkdir(exist_ok=True)

          config_js = (
              "window.APP_BACKEND_CONFIG = "
              + json.dumps(config, separators=(",", ":"))
              + ";"
          )

          (www / "builder-backend-config.js").write_text(config_js)

          backend_runtime = r"""
          (() => {
            const cfg = window.APP_BACKEND_CONFIG || {};
            window.BuilderBackend = {
              config: cfg,
              provider: cfg.provider || "none",
              ready: true
            };
          })();
          """

          admob = m.get("admob") or {}
          enabled = str(admob.get("enabled", False)).lower() in ("true", "1", "yes")

          if enabled:
            test_mode = str(admob.get("test_mode", True)).lower() in ("true", "1", "yes")

            ids = {
              "appId": admob.get("app_id", ""),
              "banner": admob.get("banner_id", ""),
              "interstitial": admob.get("interstitial_id", ""),
              "rewarded": admob.get("rewarded_id", ""),
              "testMode": test_mode,
              "frequency": int(admob.get("frequency", 3) or 3)
            }

            if test_mode:
              ids["appId"] = ids["appId"] or "ca-app-pub-3940256099942544~3347511713"
              ids["banner"] = ids["banner"] or "ca-app-pub-3940256099942544/6300978111"
              ids["interstitial"] = ids["interstitial"] or "ca-app-pub-3940256099942544/1033173712"
              ids["rewarded"] = ids["rewarded"] or "ca-app-pub-3940256099942544/5224354917"

            admob_config = "window.BUILDER_ADMOB = " + json.dumps(ids) + ";"

            admob_runtime = r"""
            (() => {
              const cfg = window.BUILDER_ADMOB || {};
              let adCount = 0;

              async function startAds() {
                if (!window.Capacitor || !window.Capacitor.isNativePlatform?.()) return;

                const AdMob = window.Capacitor.Plugins?.AdMob;
                if (!AdMob) {
                  console.warn("AdMob native plugin bridge not found.");
                  return;
                }

                try {
                  await AdMob.initialize({
                    requestTrackingAuthorization: true,
                    initializeForTesting: cfg.testMode
                  });

                  try {
                    const consent = await AdMob.requestConsentInfo();

                    if (consent?.isConsentFormAvailable &&
                        consent?.status === "REQUIRED") {
                      await AdMob.showConsentForm();
                    }
                  } catch (consentError) {
                    console.warn("AdMob consent flow:", consentError);
                  }

                  if (cfg.banner) {
                    await AdMob.showBanner({
                      adId: cfg.banner,
                      adSize: "ADAPTIVE_BANNER",
                      position: "BOTTOM_CENTER",
                      isTesting: !!cfg.testMode
                    });
                  }

                  window.BuilderShowInterstitial = async () => {
                    if (!cfg.interstitial) return;
                    try {
                      await AdMob.prepareInterstitial({
                        adId: cfg.interstitial,
                        isTesting: !!cfg.testMode
                      });
                      await AdMob.showInterstitial();
                    } catch (e) {
                      console.warn("Interstitial:", e);
                    }
                  };

                  window.BuilderShowRewarded = async () => {
                    if (!cfg.rewarded) return null;
                    try {
                      await AdMob.prepareRewardVideoAd({
                        adId: cfg.rewarded,
                        isTesting: !!cfg.testMode
                      });
                      return await AdMob.showRewardVideoAd();
                    } catch (e) {
                      console.warn("Rewarded ad:", e);
                      return null;
                    }
                  };

                  console.log("AdMob initialization completed.");
                } catch (e) {
                  console.error("AdMob initialization failed:", e);
                }
              }

              document.addEventListener("DOMContentLoaded", startAds);
              window.addEventListener("builder-interstitial", () => {
                adCount++;
                if (cfg.frequency > 0 && adCount % cfg.frequency === 0) {
                  window.BuilderShowInterstitial?.();
                }
              });
            })();
            """

            (www / "builder-admob-config.js").write_text(admob_config)
            (www / "builder-admob-runtime.js").write_text(admob_runtime)

          html_files = list(www.rglob("*.html"))

          for file in html_files:
            html = file.read_text(errors="ignore")
            scripts = '<script src="builder-backend-config.js"></script>'

            if enabled:
              scripts += (
                '<script src="builder-admob-config.js"></script>'
                '<script src="builder-admob-runtime.js"></script>'
              )

            if "builder-backend-config.js" not in html:
              if "</body>" in html.lower():
                pos = html.lower().rfind("</body>")
                html = html[:pos] + scripts + html[pos:]
              else:
                html += scripts

              file.write_text(html)

          print("Backend and optional AdMob runtime prepared.")
          PY

      - name: Generate app icon and splash assets
        if: steps.project.outputs.type == 'web'
        env:
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        working-directory: project
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow

          python3 - <<'PY'
          import json, os, pathlib, math
          from PIL import Image, ImageDraw, ImageFont

          m = json.loads(os.environ["MANIFEST_JSON"])
          branding = m.get("branding") or {}

          name = str(m.get("app_name", "My App"))
          category = str(m.get("category", "app")).strip()
          primary = str(branding.get("primary_color", "#2457D6"))
          secondary = str(branding.get("secondary_color", "#FFFFFF"))
          background = str(branding.get("splash_background", secondary))

          def color(value, fallback):
              try:
                  value = value.lstrip("#")
                  if len(value) == 6:
                      return tuple(int(value[i:i+2], 16) for i in (0, 2, 4))
              except Exception:
                  pass
              return fallback

          primary_rgb = color(primary, (36, 87, 214))
          secondary_rgb = color(secondary, (255, 255, 255))
          bg_rgb = color(background, (255, 255, 255))

          font_path = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          try:
              font = ImageFont.truetype(font_path, 300)
          except Exception:
              font = ImageFont.load_default()

          def draw_icon(size):
              im = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              d = ImageDraw.Draw(im)
              margin = int(size * .08)
              d.rounded_rectangle(
                  (margin, margin, size-margin, size-margin),
                  radius=int(size*.23),
                  fill=primary_rgb
              )
              letter = (name[:1] or "A").upper()
              f = ImageFont.truetype(font_path, int(size*.48))
              box = d.textbbox((0, 0), letter, font=f)
              x = (size - (box[2]-box[0])) / 2
              y = (size - (box[3]-box[1])) / 2 - box[1]
              d.text((x, y), letter, fill=secondary_rgb, font=f)
              return im

          icon = draw_icon(1024)
          icon.save("builder-icon.png")

          splash = Image.new("RGB", (1600, 2400), bg_rgb)
          d = ImageDraw.Draw(splash)
          logo = draw_icon(600)
          splash.paste(logo, (500, 700), logo)

          try:
              title_font = ImageFont.truetype(font_path, 76)
              small_font = ImageFont.truetype(font_path, 34)
          except Exception:
              title_font = ImageFont.load_default()
              small_font = ImageFont.load_default()

          def centered(text, y, font, fill):
              box = d.textbbox((0, 0), text, font=font)
              x = (1600 - (box[2]-box[0])) / 2
              d.text((x, y), text, font=font, fill=fill)

          centered(name[:40], 1370, title_font, primary_rgb)
          centered(category[:50], 1480, small_font, primary_rgb)
          splash.save("builder-splash.png")

          res = pathlib.Path("android/app/src/main/res")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          for density, size in sizes.items():
              folder = res / ("mipmap-" + density)
              folder.mkdir(parents=True, exist_ok=True)
              draw_icon(size).save(folder / "ic_launcher.png")
              draw_icon(size).save(folder / "ic_launcher_round.png")

          # Adaptive icon foreground with transparent background.
          foreground = Image.new("RGBA", (432, 432), (0, 0, 0, 0))
          mark = draw_icon(300)
          foreground.paste(mark, (66, 66), mark)
          folder = res / "mipmap-xxxhdpi"
          foreground.save(folder / "ic_launcher_foreground.png")

          anydpi = res / "mipmap-anydpi-v26"
          anydpi.mkdir(parents=True, exist_ok=True)

          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
            <background android:drawable="@color/ic_launcher_background"/>
            <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>'''

          (anydpi / "ic_launcher.xml").write_text(adaptive)
          (anydpi / "ic_launcher_round.xml").write_text(adaptive)

          values = res / "values"
          values.mkdir(parents=True, exist_ok=True)
          (values / "builder_colors.xml").write_text(
              '<?xml version="1.0" encoding="utf-8"?>'
              '<resources><color name="ic_launcher_background">'
              + primary + '</color></resources>'
          )

          splash_dir = res / "drawable-nodpi"
          splash_dir.mkdir(parents=True, exist_ok=True)
          splash.save(splash_dir / "splash.png")

          print("Generated original app icon and splash assets.")
          PY

      - name: Sync Capacitor Android project
        if: steps.project.outputs.type == 'web'
        working-directory: project
        run: |
          npx cap sync android

      - name: Configure Android application metadata
        if: steps.project.outputs.type == 'web'
        env:
          APP_NAME: ${{ steps.config.outputs.app_name }}
          PACKAGE_ID: ${{ steps.config.outputs.package_id }}
          APP_VERSION: ${{ steps.config.outputs.version }}
          VERSION_CODE: ${{ steps.config.outputs.version_code }}
        working-directory: project
        run: |
          python3 - <<'PY'
          import pathlib, os, re, xml.etree.ElementTree as ET

          app = pathlib.Path("android/app")
          gradle = app / "build.gradle"

          if not gradle.exists():
              raise SystemExit("Android app/build.gradle not found.")

          text = gradle.read_text()

          text = re.sub(
              r'applicationId\s+["\'][^"\']+["\']',
              'applicationId "' + os.environ["PACKAGE_ID"] + '"',
              text
          )

          text = re.sub(
              r'versionCode\s+\d+',
              'versionCode ' + os.environ["VERSION_CODE"],
              text
          )

          text = re.sub(
              r'versionName\s+["\'][^"\']+["\']',
              'versionName "' + os.environ["APP_VERSION"] + '"',
              text
          )

          gradle.write_text(text)

          strings = app / "src/main/res/values/strings.xml"
          if strings.exists():
              tree = ET.parse(strings)
              root = tree.getroot()
              found = False

              for item in root.findall("string"):
                  if item.attrib.get("name") == "app_name":
                      item.text = os.environ["APP_NAME"]
                      found = True

              if not found:
                  ET.SubElement(root, "string", {"name": "app_name"}).text = os.environ["APP_NAME"]

              tree.write(strings, encoding="utf-8", xml_declaration=True)

          print("Android app metadata configured.")
          PY

      - name: Prepare native Android project
        if: steps.project.outputs.type == 'native'
        run: |
          mkdir -p native-project
          cp -R "${{ steps.project.outputs.root }}/." native-project/
          chmod +x native-project/gradlew

      - name: Build Android APK
        id: build
        run: |
          set -euo pipefail

          if [ "${{ steps.project.outputs.type }}" = "web" ]; then
            cd project/android
          else
            cd native-project
          fi

          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          APK=$(find app/build/outputs/apk -type f -name '*.apk' | head -n 1)

          if [ -z "$APK" ]; then
            echo "APK output not found."
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$APK" "$GITHUB_WORKSPACE/output/app-debug.apk"

          echo "APK created successfully."

      - name: Upload APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')

          curl -fL -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary "@output/app-debug.apk" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=app-debug.apk"

      - name: Publish APK Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release_tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG")

          RELEASE_ID=$(echo "$RELEASE" | jq -r '.id')

          curl -fsSL -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"draft":false}' \
            "https://api.github.com/repos/$REPO/releases/$RELEASE_ID"

      - name: Build summary
        if: success()
        run: |
          echo "## APK Build Successful" >> "$GITHUB_STEP_SUMMARY"
          echo "- Request ID: ${{ inputs.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Release: ${{ inputs.release_tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- APK: app-debug.apk" >> "$GITHUB_STEP_SUMMARY"

      - name: Build failure summary
        if: failure()
        run: |
          echo "## APK Build Failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Check the failed step above for the exact error." >> "$GITHUB_STEP_SUMMARY"
