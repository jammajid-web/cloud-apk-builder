name: Advanced Cloud APK Builder

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID"
        required: false
        type: string
      release_tag:
        description: "Source release tag"
        required: true
        type: string
      manifest_json:
        description: "App configuration JSON"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip python3

      - name: Download source ZIP
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "*.zip" \
            --dir source

          ZIP_FILE=$(find source -maxdepth 1 -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Source ZIP not found"
            exit 1
          fi

          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted

      - name: Detect app source
        id: detect
        run: |
          HTML_FILE=$(find extracted -type f -name "index.html" | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "ERROR: index.html not found in source ZIP"
            exit 1
          fi

          echo "html_file=$HTML_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare web assets
        run: |
          mkdir -p www

          cp -R "$(dirname "${{ steps.detect.outputs.html_file }}")"/. www/

          test -f www/index.html || {
            echo "ERROR: www/index.html missing"
            exit 1
          }

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6
          npm install @capacitor/android@6
          npm install @capacitor/app@6 @capacitor/browser@6
          npm install esbuild

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.chatwave.app",
            "appName": "ChatWave",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Bundle native Capacitor plugins
        run: |
          mkdir -p www

          cat > native-entry.js <<'EOF'
          import { App } from '@capacitor/app';
          import { Browser } from '@capacitor/browser';

          window.ChatWaveNative = {
            App,
            Browser
          };
          EOF

          npx esbuild native-entry.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=es2020 \
            --outfile=www/chatwave-capacitor.js

      - name: Patch ChatWave native imports
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("www/index.html")
          html = path.read_text(encoding="utf-8")

          html = re.sub(
              r'await\s+import\(\s*["\']https://esm\.sh/@capacitor/app@6\?bundle["\']\s*\)',
              '({ App: window.ChatWaveNative.App })',
              html
          )

          html = re.sub(
              r'await\s+import\(\s*["\']https://esm\.sh/@capacitor/browser@6\?bundle["\']\s*\)',
              '({ Browser: window.ChatWaveNative.Browser })',
              html
          )

          if "chatwave-capacitor.js" not in html:
              html = re.sub(
                  r'</head>',
                  '<script src="./chatwave-capacitor.js"></script>\n</head>',
                  html,
                  count=1,
                  flags=re.IGNORECASE
              )

          if "https://esm.sh/@capacitor/app" in html:
              raise SystemExit("ERROR: Remote Capacitor App import remains")

          if "https://esm.sh/@capacitor/browser" in html:
              raise SystemExit("ERROR: Remote Capacitor Browser import remains")

          path.write_text(html, encoding="utf-8")
          print("ChatWave native imports patched successfully")
          PY
                - name: Initialize Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Apply app configuration
        env:
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          raw = os.environ.get("MANIFEST_JSON", "").strip()

          if raw:
              try:
                  config = json.loads(raw)
                  print("App configuration received")
                  print(json.dumps(config, indent=2))
              except Exception as error:
                  print("Manifest JSON could not be parsed:", error)
                  raise
          else:
              print("Using default ChatWave configuration")
          PY

      - name: Generate Android app icon
        run: |
          mkdir -p android/app/src/main/res/drawable

          cat > android/app/src/main/res/drawable/chatwave_icon.xml <<'EOF'
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#128C7E"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,31h48v34h-26l-15,12v-12h-7z"/>
          </vector>
          EOF

      - name: Configure Android app
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          xml = path.read_text(encoding="utf-8")

          if "com.chatwave.app://login-callback" not in xml:
              intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data
                          android:scheme="com.chatwave.app"
                          android:host="login-callback" />
                  </intent-filter>
              """

              xml = xml.replace(
                  "</activity>",
                  intent_filter + "\n    </activity>",
                  1
              )

          path.write_text(xml, encoding="utf-8")
          print("Android deep link configured")
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK file was not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
