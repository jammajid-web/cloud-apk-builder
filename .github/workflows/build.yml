
name: Cloud APK Builder

run-name: APK Builder - ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Unique build ID
        required: true
        type: string
      release_tag:
        description: GitHub Release tag
        required: true
        type: string
      manifest_json:
        description: App build configuration
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-build-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Android App
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      MANIFEST_JSON: ${{ inputs.manifest_json }}

    steps:
      - name: Checkout builder
        uses: actions/checkout@v4

      - name: Validate build request
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, re

          run_id = os.environ["RUN_ID"]
          tag = os.environ["RELEASE_TAG"]
          raw = os.environ["MANIFEST_JSON"]

          if not re.fullmatch(r"[a-fA-F0-9-]{20,64}", run_id):
              raise SystemExit("Invalid run_id")

          if not re.fullmatch(r"[A-Za-z0-9._-]{1,100}", tag):
              raise SystemExit("Invalid release tag")

          data = json.loads(raw)

          if not isinstance(data, dict):
              raise SystemExit("Manifest must be a JSON object")

          print("Build request validated.")
          print("App:", data.get("app_name", "My App"))
          print("Package:", data.get("package_id", "com.example.app"))
          PY

      - name: Download project source
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p source project output

          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern "source.zip" \
            --dir source

          test -s source/source.zip

          python3 - <<'PY'
          import zipfile
          from pathlib import PurePosixPath

          archive = zipfile.ZipFile("source/source.zip")

          for item in archive.infolist():
              path = PurePosixPath(item.filename)

              if path.is_absolute() or ".." in path.parts:
                  raise SystemExit("Unsafe path found in project ZIP")

              if item.filename.startswith("/"):
                  raise SystemExit("Absolute ZIP path rejected")

          archive.extractall("project")
          print("Project extracted safely.")
          PY

      - name: Read app configuration
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json, os, re

          data = json.loads(os.environ["MANIFEST_JSON"])

          app_name = str(data.get("app_name") or "My App")
          package_id = str(data.get("package_id") or "com.example.app")
          version = str(data.get("version") or "1.0.0")
          version_code = str(data.get("version_code") or "1")

          if not re.fullmatch(r"[A-Za-z0-9_]+(\.[A-Za-z0-9_]+)+", package_id):
              raise SystemExit("Invalid package ID")

          if not version_code.isdigit():
              raise SystemExit("Invalid version code")

          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("APP_NAME=" + app_name.replace("\n", " ").replace("\r", " ") + "\n")
              f.write("PACKAGE_ID=" + package_id + "\n")
              f.write("APP_VERSION=" + version + "\n")
              f.write("VERSION_CODE=" + version_code + "\n")
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail

          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Detect project type
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          if find project -name gradlew -type f \
            -not -path '*/node_modules/*' | grep -q .; then

            echo "type=native" >> "$GITHUB_OUTPUT"
            echo "Native Android Gradle project detected."

          elif find project -name index.html -type f \
            -not -path '*/node_modules/*' \
            -not -path '*/android/*' | grep -q .; then

            echo "type=web" >> "$GITHUB_OUTPUT"
            echo "Web project detected."

          else
            echo "Unsupported project."
            echo "ZIP must contain an Android Gradle project or web app with index.html."
            exit 1
          fi

      - name: Build web project with Capacitor
        if: steps.detect.outputs.type == 'web'
        shell: bash
        run: |
          set -euo pipefail

          cd project

          ROOT="$(find . -name index.html -type f \
            -not -path './node_modules/*' \
            -not -path './android/*' \
            -not -path './.git/*' | head -n 1)"

          test -n "$ROOT"

          WEB_DIR="$(dirname "$ROOT")"

          mkdir -p /tmp/cap-www

          rsync -a \
            --exclude='node_modules' \
            --exclude='android' \
            --exclude='.git' \
            "$WEB_DIR"/ /tmp/cap-www/

          rm -rf www
          mv /tmp/cap-www www

          if [ ! -f package.json ]; then
            npm init -y
          fi

          npm install @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

          cat > capacitor.config.json <<EOF
          {
            "appId": "$PACKAGE_ID",
            "appName": "$APP_NAME",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Locate Android project
        id: android
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ steps.detect.outputs.type }}" = "native" ]; then
            GRADLE="$(find project -name gradlew -type f \
              -not -path '*/node_modules/*' | head -n 1)"

            ANDROID_DIR="$(dirname "$GRADLE")"
          else
            ANDROID_DIR="project/android"
          fi

          test -f "$ANDROID_DIR/gradlew"

          echo "dir=$ANDROID_DIR" >> "$GITHUB_OUTPUT"

          chmod +x "$ANDROID_DIR/gradlew"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          cd "${{ steps.android.outputs.dir }}"

          ./gradlew --no-daemon assembleDebug

      - name: Find and prepare APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find project -type f \
            -path '*/build/outputs/apk/*/*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "APK output not found."
            exit 1
          fi

          cp "$APK" output/app-debug.apk

          test -s output/app-debug.apk

          echo "APK created successfully."
          ls -lh output/app-debug.apk

      - name: Upload APK to GitHub Release
        shell: bash
        run: |
          set -euo pipefail

          gh release upload "$RELEASE_TAG" \
            output/app-debug.apk \
            --repo "$GH_REPO" \
            --clobber

      - name: Remove temporary source ZIP
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          gh release delete-asset "$RELEASE_TAG" source.zip \
            --repo "$GH_REPO" \
            --yes

      - name: Publish completed release
        shell: bash
        run: |
          set -euo pipefail

          gh release edit "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --draft=false \
            --prerelease=false

      - name: Build summary
        if: success()
        shell: bash
        run: |
          {
            echo "## APK Build Successful"
            echo ""
            echo "- App: $APP_NAME"
            echo "- Package: $PACKAGE_ID"
            echo "- Version: $APP_VERSION"
            echo "- Build ID: $RUN_ID"
            echo "- APK: app-debug.apk"
            echo ""
            echo "The APK is attached to the GitHub Release."
          } >> "$GITHUB_STEP_SUMMARY"
