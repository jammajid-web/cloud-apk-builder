
name: Advanced Cloud APK Builder

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run ID"
        required: false
        type: string
      release_tag:
        description: "Source release tag"
        required: true
        type: string
      manifest_json:
        description: "App configuration JSON"
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip zip python3

      - name: Download improved ChatWave source
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          mkdir -p source extracted

          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "ChatWave-Improved-Source.zip" \
            --dir source

          ZIP_FILE="source/ChatWave-Improved-Source.zip"

          test -f "$ZIP_FILE" || {
            echo "ERROR: ChatWave-Improved-Source.zip not found"
            exit 1
          }

          unzip -q "$ZIP_FILE" -d extracted

          HTML_FILE=$(find extracted -type f -name index.html | head -n 1)

          test -n "$HTML_FILE" || {
            echo "ERROR: index.html not found"
            exit 1
          }

          echo "Source downloaded successfully"

      - name: Detect app source
        id: detect
        run: |
          HTML_FILE=$(find extracted -type f -name index.html | head -n 1)

          if [ -z "$HTML_FILE" ]; then
            echo "index.html missing"
            exit 1
          fi

          echo "html_file=$HTML_FILE" >> "$GITHUB_OUTPUT"

      - name: Prepare web assets
        run: |
          mkdir -p www
          cp -R "$(dirname "${{ steps.detect.outputs.html_file }}")"/. www/
          test -f www/index.html

      - name: Install Capacitor dependencies
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6
          npm install @capacitor/android@6
          npm install @capacitor/app@6 @capacitor/browser@6
          npm install esbuild

      - name: Configure Capacitor
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.chatwave.app",
            "appName": "ChatWave",
            "webDir": "www",
            "bundledWebRuntime": false,
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Bundle Capacitor plugins
        run: |
          cat > native-entry.js <<'EOF'
          import { App } from '@capacitor/app';
          import { Browser } from '@capacitor/browser';
          import { registerPlugin } from '@capacitor/core';

          window.ChatWaveNative = {
            App,
            Browser,
            registerPlugin
          };
          EOF

          npx esbuild native-entry.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --target=es2020 \
            --outfile=www/chatwave-capacitor.js

      - name: Patch Capacitor imports
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          path = Path("www/index.html")
          html = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"""(?:await\s*)?import\s*\(\s*(['"])"""
              r"""https://esm\.sh/@capacitor/(app|browser|core)"""
              r"""[^'"]*\1\s*\)""",
              re.IGNORECASE
          )

          def replace_import(match):
              name = match.group(2).lower()

              if name == "app":
                  return "Promise.resolve({ App: window.ChatWaveNative.App })"

              if name == "browser":
                  return "Promise.resolve({ Browser: window.ChatWaveNative.Browser })"

              return "Promise.resolve({ registerPlugin: window.ChatWaveNative.registerPlugin })"

          html, count = pattern.subn(replace_import, html)
          print("Capacitor imports replaced:", count)

          if "chatwave-capacitor.js" not in html:
              script = '<script src="./chatwave-capacitor.js"></script>'

              if re.search(r"</head\s*>", html, re.I):
                  html = re.sub(
                      r"</head\s*>",
                      script + "\n</head>",
                      html,
                      count=1,
                      flags=re.I
                  )
              else:
                  raise SystemExit("HTML head tag not found")

          if pattern.search(html):
              raise SystemExit("Remote Capacitor imports remain")

          path.write_text(html, encoding="utf-8")
          PY

      - name: Initialize Android
        run: |
          npx cap add android
          npx cap sync android

      - name: Install microphone and camera plugin
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          files = list(
              Path("android/app/src/main").rglob("MainActivity.java")
          )

          if not files:
              raise SystemExit("MainActivity.java not found")

          main_file = files[0]
          source = main_file.read_text(encoding="utf-8")

          package_match = re.search(
              r"^\s*package\s+([A-Za-z0-9_.]+)\s*;",
              source,
              re.MULTILINE
          )

          if not package_match:
              raise SystemExit("Android package not found")

          package_name = package_match.group(1)

          plugin = r'''
          package PACKAGE_NAME;

          import android.Manifest;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.getcapacitor.annotation.Permission;
          import com.getcapacitor.annotation.PermissionCallback;

          @CapacitorPlugin(
              name = "MediaPermissions",
              permissions = {
                  @Permission(
                      alias = "microphone",
                      strings = { Manifest.permission.RECORD_AUDIO }
                  ),
                  @Permission(
                      alias = "camera",
                      strings = { Manifest.permission.CAMERA }
                  )
              }
          )
          public class MediaPermissionsPlugin extends Plugin {

              @PluginMethod
              public void request(PluginCall call) {
                  requestPermissionForAliases(
                      new String[]{"microphone", "camera"},
                      call,
                      "permissionsCallback"
                  );
              }

              @PluginMethod
              public void requestPermissions(PluginCall call) {
                  requestPermissionForAliases(
                      new String[]{"microphone", "camera"},
                      call,
                      "permissionsCallback"
                  );
              }

              @PluginMethod
              public void requestMicrophone(PluginCall call) {
                  requestPermissionForAlias(
                      "microphone", call, "microphoneCallback"
                  );
              }

              @PluginMethod
              public void requestCamera(PluginCall call) {
                  requestPermissionForAlias(
                      "camera", call, "cameraCallback"
                  );
              }

              @PermissionCallback
              private void permissionsCallback(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put(
                      "microphone",
                      getPermissionState("microphone").toString().equals("granted")
                  );
                  result.put(
                      "camera",
                      getPermissionState("camera").toString().equals("granted")
                  );
                  call.resolve(result);
              }

              @PermissionCallback
              private void microphoneCallback(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put(
                      "microphone",
                      getPermissionState("microphone").toString().equals("granted")
                  );
                  call.resolve(result);
              }

              @PermissionCallback
              private void cameraCallback(PluginCall call) {
                  JSObject result = new JSObject();
                  result.put(
                      "camera",
                      getPermissionState("camera").toString().equals("granted")
                  );
                  call.resolve(result);
              }
          }
          '''

          plugin = plugin.replace("PACKAGE_NAME", package_name)

          plugin_file = main_file.parent / "MediaPermissionsPlugin.java"
          plugin_file.write_text(plugin.strip() + "\n", encoding="utf-8")

          if "MediaPermissionsPlugin.class" not in source:
              if "import android.os.Bundle;" not in source:
                  source = source.replace(
                      package_match.group(0),
                      package_match.group(0) +
                      "\n\nimport android.os.Bundle;",
                      1
                  )

              if "super.onCreate(savedInstanceState);" in source:
                  source = source.replace(
                      "super.onCreate(savedInstanceState);",
                      "registerPlugin(MediaPermissionsPlugin.class);\n"
                      "        super.onCreate(savedInstanceState);",
                      1
                  )
              else:
                  class_open = re.search(
                      r"public\s+class\s+MainActivity\s+extends\s+BridgeActivity\s*\{",
                      source
                  )

                  if not class_open:
                      raise SystemExit(
                          "Unsupported MainActivity structure"
                      )

                  method = """
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  registerPlugin(MediaPermissionsPlugin.class);
                  super.onCreate(savedInstanceState);
              }
          """

                  source = (
                      source[:class_open.end()]
                      + "\n"
                      + method
                      + "\n"
                      + source[class_open.end():]
                  )

              main_file.write_text(source, encoding="utf-8")

          print("MediaPermissions plugin installed")
          PY

      - name: Configure Android permissions and icon
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          xml = manifest.read_text(encoding="utf-8")

          permissions = [
              "android.permission.RECORD_AUDIO",
              "android.permission.CAMERA",
              "android.permission.MODIFY_AUDIO_SETTINGS"
          ]

          for permission in permissions:
              if permission not in xml:
                  xml = xml.replace(
                      "<application",
                      f'<uses-permission android:name="{permission}" />\n'
                      "<application",
                      1
                  )

          match = re.search(r"<application\b[^>]*>", xml)

          if not match:
              raise SystemExit("Application tag not found")

          tag = match.group(0)

          for attr in ("icon", "roundIcon"):
              pattern = rf'\s+android:{attr}="[^"]*"'
              value = f' android:{attr}="@drawable/chatwave_icon"'

              if re.search(pattern, tag):
                  tag = re.sub(pattern, value, tag)
              else:
                  tag = tag[:-1] + value + ">"

          xml = xml[:match.start()] + tag + xml[match.end():]

          if 'android:scheme="com.chatwave.app"' not in xml:
              intent_filter = """
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data
                          android:scheme="com.chatwave.app"
                          android:host="login-callback" />
                  </intent-filter>
              """

              xml = xml.replace(
                  "</activity>",
                  intent_filter + "\n</activity>",
                  1
              )

          manifest.write_text(xml, encoding="utf-8")

          icon = Path(
              "android/app/src/main/res/drawable/chatwave_icon.xml"
          )
          icon.parent.mkdir(parents=True, exist_ok=True)

          icon.write_text("""<vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#128C7E"
                  android:pathData="M54,4A50,50 0,1 0,54 104A50,50 0,1 0,54 4"/>
              <path
                  android:fillColor="#FFFFFF"
                  android:pathData="M30,31h48v34h-26l-15,12v-12h-7z"/>
          </vector>
          """, encoding="utf-8")

          print("Permissions, icon and OAuth deep link configured")
          PY

      - name: Apply app configuration
        env:
          MANIFEST_JSON: ${{ inputs.manifest_json }}
        run: |
          python3 <<'PY'
          import json
          import os

          raw = os.environ.get("MANIFEST_JSON", "").strip()

          if raw:
              config = json.loads(raw)
              print("Configuration JSON is valid")
          else:
              print("Using default configuration")
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Verify APK
        run: |
          APK="android/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "APK not generated"
            exit 1
          fi

          ls -lh "$APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ChatWave-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            android/app/build/outputs/apk/debug/app-debug.apk \
            --repo "$GITHUB_REPOSITORY" \
            --clobber
