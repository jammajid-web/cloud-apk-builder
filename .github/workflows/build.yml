
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Android application name"
        required: true
        type: string
        default: "My App"

      package_id:
        description: "Android package ID"
        required: true
        type: string
        default: "com.example.myapp"

      html:
        description: "Base64 encoded HTML"
        required: false
        type: string
        default: ""

      css:
        description: "Base64 encoded CSS"
        required: false
        type: string
        default: ""

      js:
        description: "Base64 encoded JavaScript"
        required: false
        type: string
        default: ""

      ads_enabled:
        description: "Enable AdMob"
        required: false
        type: boolean
        default: false

      admob_test_mode:
        description: "Use Google test ads"
        required: false
        type: boolean
        default: true

      admob_app_id:
        description: "AdMob Android App ID"
        required: false
        type: string
        default: ""

      admob_banner_id:
        description: "Banner Ad Unit ID"
        required: false
        type: string
        default: ""

      admob_interstitial_id:
        description: "Interstitial Ad Unit ID"
        required: false
        type: string
        default: ""

      admob_rewarded_id:
        description: "Rewarded Ad Unit ID"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Create Android application
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
          HTML_B64: ${{ inputs.html }}
          CSS_B64: ${{ inputs.css }}
          JS_B64: ${{ inputs.js }}
          ADS_ENABLED: ${{ inputs.ads_enabled }}
          ADMOB_TEST_MODE: ${{ inputs.admob_test_mode }}
          ADMOB_APP_ID: ${{ inputs.admob_app_id }}
          ADMOB_BANNER_ID: ${{ inputs.admob_banner_id }}
          ADMOB_INTERSTITIAL_ID: ${{ inputs.admob_interstitial_id }}
          ADMOB_REWARDED_ID: ${{ inputs.admob_rewarded_id }}

        run: |
          set -e

          if ! [[ "$PACKAGE_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "Invalid Android package ID: $PACKAGE_ID"
            exit 1
          fi

          mkdir -p www

          node <<'NODE'
          const fs = require("fs");

          const html = Buffer.from(process.env.HTML_B64 || "", "base64").toString("utf8");
          const css = Buffer.from(process.env.CSS_B64 || "", "base64").toString("utf8");
          const js = Buffer.from(process.env.JS_B64 || "", "base64").toString("utf8");

          fs.writeFileSync("www/index.html", `<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="style.css">
            <script src="admob-config.js"></script>
            <script src="admob-runtime.bundle.js"></script>
          </head>
          <body>
          ${html}
          <script src="script.js"><\/script>
          </body>
          </html>`);

          fs.writeFileSync("www/style.css", css);
          fs.writeFileSync("www/script.js", js);

          const testMode = process.env.ADMOB_TEST_MODE === "true";

          const config = {
            enabled: process.env.ADS_ENABLED === "true",
            testMode,
            appId: testMode
              ? "ca-app-pub-3940256099942544~3347511713"
              : process.env.ADMOB_APP_ID || "",
            bannerId: testMode
              ? "ca-app-pub-3940256099942544/6300978111"
              : process.env.ADMOB_BANNER_ID || "",
            interstitialId: testMode
              ? "ca-app-pub-3940256099942544/1033173712"
              : process.env.ADMOB_INTERSTITIAL_ID || "",
            rewardedId: testMode
              ? "ca-app-pub-3940256099942544/5224354917"
              : process.env.ADMOB_REWARDED_ID || ""
          };

          fs.writeFileSync(
            "www/admob-config.js",
            "window.APK_ADMOB_CONFIG = " + JSON.stringify(config) + ";"
          );
          NODE

          if [ "$ADS_ENABLED" = "true" ]; then

            if [ "$ADMOB_TEST_MODE" != "true" ]; then
              if ! [[ "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]+~[0-9]+$ ]]; then
                echo "Invalid production AdMob App ID"
                exit 1
              fi
            fi

            npm install @capacitor-community/admob@6 esbuild

            cat > admob-runtime.js <<'JS'
          import {
            AdMob,
            AdmobConsentStatus,
            BannerAdSize,
            BannerAdPosition
          } from "@capacitor-community/admob";

          const config = window.APK_ADMOB_CONFIG || {};
          let initialized = false;

          async function initialize() {
            if (!config.enabled) {
              throw new Error("AdMob is disabled.");
            }

            if (initialized) return true;

            try {
              let consent = await AdMob.requestConsentInfo();

              if (
                consent.isConsentFormAvailable &&
                consent.status === AdmobConsentStatus.REQUIRED
              ) {
                consent = await AdMob.showConsentForm();
              }

              if (!consent.canRequestAds) {
                throw new Error("AdMob consent is not available yet.");
              }

              await AdMob.initialize();
              initialized = true;
              return true;

            } catch (error) {
              console.error("AdMob initialization:", error);
              throw error;
            }
          }

          window.NativeAdMob = {

            initialize,

            async showBanner() {
              await initialize();

              if (!config.bannerId) {
                throw new Error("Banner Ad ID is missing.");
              }

              return AdMob.showBanner({
                adId: config.bannerId,
                adSize: BannerAdSize.ADAPTIVE_BANNER,
                position: BannerAdPosition.BOTTOM_CENTER,
                isTesting: config.testMode,
                margin: 0
              });
            },

            async hideBanner() {
              return AdMob.hideBanner();
            },

            async removeBanner() {
              return AdMob.removeBanner();
            },

            async showInterstitial() {
              await initialize();

              if (!config.interstitialId) {
                throw new Error("Interstitial Ad ID is missing.");
              }

              await AdMob.prepareInterstitial({
                adId: config.interstitialId,
                isTesting: config.testMode
              });

              return AdMob.showInterstitial();
            },

            async showRewarded() {
              await initialize();

              if (!config.rewardedId) {
                throw new Error("Rewarded Ad ID is missing.");
              }

              await AdMob.prepareRewardVideoAd({
                adId: config.rewardedId,
                isTesting: config.testMode
              });

              return AdMob.showRewardVideoAd();
            },

            getConfig() {
              return { ...config };
            }
          };
          JS

            npx esbuild admob-runtime.js \
              --bundle \
              --platform=browser \
              --format=iife \
              --outfile=www/admob-runtime.bundle.js

          else

            echo "AdMob disabled. Skipping native AdMob plugin."

            echo "window.NativeAdMob = null;" > www/admob-runtime.bundle.js

          fi

          npm init -y

          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1

          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir=www

          npx cap add android

          if [ "$ADS_ENABLED" = "true" ]; then

            node <<'NODE'
          const fs = require("fs");

          const appId = process.env.ADMOB_TEST_MODE === "true"
            ? "ca-app-pub-3940256099942544~3347511713"
            : process.env.ADMOB_APP_ID;

          if (!appId) {
            throw new Error("AdMob App ID is required.");
          }

          const escapeXml = value => value
            .replace(/&/g, "&amp;")
            .replace(/"/g, "&quot;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

          const stringsDir = "android/app/src/main/res/values";
          fs.mkdirSync(stringsDir, { recursive: true });

          fs.writeFileSync(
            stringsDir + "/admob_strings.xml",
            `<resources>
              <string name="admob_app_id">${escapeXml(appId)}</string>
            </resources>`
          );

          const manifestPath = "android/app/src/main/AndroidManifest.xml";
          let manifest = fs.readFileSync(manifestPath, "utf8");

          const metadata = `
              <meta-data
                  android:name="com.google.android.gms.ads.APPLICATION_ID"
                  android:value="@string/admob_app_id" />`;

          if (!manifest.includes("com.google.android.gms.ads.APPLICATION_ID")) {
            manifest = manifest.replace("</application>", metadata + "\n    </application>");
          }

          fs.writeFileSync(manifestPath, manifest);
          NODE

          fi

          npx cap sync android

      - name: Configure Gradle
        run: |
          sed -i 's#^distributionUrl=.*#distributionUrl=https\://mirrors.huaweicloud.com/gradle/gradle-8.11.1-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties

          sed -i '/^networkTimeout=/d' android/gradle/wrapper/gradle-wrapper.properties

          echo 'networkTimeout=300000' >> android/gradle/wrapper/gradle-wrapper.properties

          sed -i '/^distributionSha256Sum=/d' android/gradle/wrapper/gradle-wrapper.properties

          echo 'distributionSha256Sum=f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6' >> android/gradle/wrapper/gradle-wrapper.properties

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
