
name: Build Android APK

"on":
  workflow_dispatch:
    inputs:
      app_name:
        description: Application name
        required: true
        default: My APK App
      package_id:
        description: Android package ID
        required: true
        default: com.example.myapp
      html_b64:
        description: Base64 HTML source
        required: false
        default: ""
      css_b64:
        description: Base64 CSS source
        required: false
        default: ""
      js_b64:
        description: Base64 JavaScript source
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      APP_NAME: ${{ inputs.app_name }}
      PACKAGE_ID: ${{ inputs.package_id }}
      HTML_B64: ${{ inputs.html_b64 }}
      CSS_B64: ${{ inputs.css_b64 }}
      JS_B64: ${{ inputs.js_b64 }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Create Android application
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/android@7
          npm install --save-dev @capacitor/cli@7

          mkdir -p www

          node -e 'const fs=require("fs"); fs.writeFileSync("capacitor.config.json", JSON.stringify({appId:process.env.PACKAGE_ID,appName:process.env.APP_NAME,webDir:"www"},null,2))'

          if [ -n "$HTML_B64" ]; then
            printf '%s' "$HTML_B64" | base64 -d > www/index.html
          else
            echo '<h1>Cloud APK Builder</h1>' > www/index.html
          fi

          if [ -n "$CSS_B64" ]; then
            printf '%s' "$CSS_B64" | base64 -d > www/style.css
          fi

          if [ -n "$JS_B64" ]; then
            printf '%s' "$JS_B64" | base64 -d > www/script.js
          fi

          npx cap add android
          npx cap sync android

      - name: Build APK
        run: ./gradlew assembleDebug
        working-directory: android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
