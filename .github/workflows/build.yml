
name: Advanced Cloud APK Builder
run-name: APK Builder - ${{ inputs.run_id }}

on:
  workflow_dispatch:
    inputs:
      run_id:
        required: true
        type: string
      release_tag:
        required: true
        type: string
      manifest_json:
        required: true
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: apk-build-${{ inputs.run_id }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      MANIFEST_JSON: ${{ inputs.manifest_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate manifest
        run: |
          python3 - <<'PY'
          import json, os, re

          d = json.loads(os.environ["MANIFEST_JSON"])
          assert isinstance(d, dict)

          assert re.fullmatch(
              r"[a-f0-9-]{36}",
              os.environ["RUN_ID"],
              re.I
          )

          assert re.fullmatch(
              r"[A-Za-z0-9._-]{1,100}",
              os.environ["RELEASE_TAG"]
          )

          package = d.get("package_id", "com.example.app")

          assert re.fullmatch(
              r"[A-Za-z][A-Za-z0-9_]*(\.[A-Za-z][A-Za-z0-9_]*)+",
              package
          )

          backend = d.get("backend", {})
          assert backend.get("provider", "none") in (
              "none", "supabase", "firebase"
          )

          admob = d.get("admob", {})
          assert isinstance(admob, dict)

          print("Manifest validation successful")
          print("App:", d.get("app_name", "My App"))
          print("Package:", package)
          print("Backend:", backend.get("provider", "none"))
          print("AdMob:", bool(admob.get("enabled")))
          PY

      - name: Download source ZIP
        run: |
          set -euo pipefail

          mkdir -p source project output

          gh release download "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --pattern source.zip \
            --dir source

          test -s source/source.zip

      - name: Safely extract project ZIP
        run: |
          python3 - <<'PY'
          import zipfile, os, stat
          from pathlib import PurePosixPath

          dest = os.path.abspath("project")

          with zipfile.ZipFile("source/source.zip") as z:
              items = z.infolist()

              if len(items) > 10000:
                  raise SystemExit("Too many ZIP entries")

              if sum(x.file_size for x in items) > 500 * 1024 * 1024:
                  raise SystemExit("Project expands beyond 500 MB")

              checked = []

              for item in items:
                  name = item.filename.replace("\\", "/")
                  path = PurePosixPath(name)
                  mode = item.external_attr >> 16

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit("Unsafe ZIP path")

                  if stat.S_ISLNK(mode):
                      raise SystemExit("ZIP symlinks are not allowed")

                  target = os.path.abspath(os.path.join(dest, *path.parts))

                  if os.path.commonpath([dest, target]) != dest:
                      raise SystemExit("ZIP path traversal")

                  checked.append((item, target))

              for item, target in checked:
                  if item.is_dir():
                      os.makedirs(target, exist_ok=True)
                  else:
                      os.makedirs(os.path.dirname(target), exist_ok=True)

                      with z.open(item) as src, open(target, "wb") as out:
                          while True:
                              chunk = src.read(1024 * 1024)
                              if not chunk:
                                  break
                              out.write(chunk)

          print("Project extracted successfully")
          PY

      - name: Load manifest values
        run: |
          python3 - <<'PY'
          import json, os

          d = json.loads(os.environ["MANIFEST_JSON"])

          values = {
              "APP_NAME": str(d.get("app_name", "My App")),
              "PACKAGE_ID": str(d.get("package_id", "com.example.app")),
              "APP_VERSION": str(d.get("version", "1.0.0")),
              "VERSION_CODE": str(d.get("version_code", "1"))
          }

          with open(os.environ["GITHUB_ENV"], "a") as f:
              for key, value in values.items():
                  value = value.replace("\n", " ").replace("\r", " ")
                  f.write(key + "=" + value + "\n")

          with open("manifest.json", "w") as f:
              json.dump(d, f)

          print("Manifest loaded")
          PY

      - name: Detect project type
        id: detect
        run: |
          if find project -name gradlew -type f \
            -not -path '*/node_modules/*' | grep -q .; then

            echo "type=native" >> "$GITHUB_OUTPUT"

          elif find project -name index.html -type f \
            -not -path '*/node_modules/*' \
            -not -path '*/android/*' | grep -q .; then

            echo "type=web" >> "$GITHUB_OUTPUT"

          else
            echo "Project must contain index.html or Android gradlew"
            exit 1
          fi

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # UPDATED ANDROID SDK SETUP
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK components
        run: |
          set -euo pipefail

          sdkmanager --install \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Prepare web project
        if: steps.detect.outputs.type == 'web'
        run: |
          set -euo pipefail

          cd project

          ROOT="$(find . -name index.html -type f \
            -not -path './node_modules/*' \
            -not -path './android/*' | head -n 1)"

          test -n "$ROOT"

          WEB_DIR="$(dirname "$ROOT")"

          mkdir -p /tmp/webroot

          rsync -a \
            --exclude=node_modules \
            --exclude=android \
            --exclude=.git \
            "$WEB_DIR"/ /tmp/webroot/

          rm -rf www
          mv /tmp/webroot www

          [ -f package.json ] || npm init -y

          npm install \
            @capacitor/core@6 \
            @capacitor/cli@6 \
            @capacitor/android@6

          python3 - <<'PY'
          import json

          d = json.load(open("../manifest.json"))

          config = {
              "appId": d.get("package_id", "com.example.app"),
              "appName": d.get("app_name", "My App"),
              "webDir": "www"
          }

          json.dump(
              config,
              open("capacitor.config.json", "w"),
              indent=2
          )
          PY

      - name: Generate backend runtime
        if: steps.detect.outputs.type == 'web'
        run: |
          python3 - <<'PY'
          import json

          d = json.load(open("manifest.json"))
          b = d.get("backend", {"provider": "none"})

          provider = b.get("provider", "none")

          cfg = {
              "provider": provider,
              "features": b.get("features", {})
          }

          if provider == "supabase":
              cfg["url"] = b["url"]
              cfg["publishable_key"] = b["publishable_key"]

          elif provider == "firebase":
              cfg["firebase"] = b["config"]

          json.dump(
              cfg,
              open("project/www/builder-config.json", "w")
          )

          js = r'''
          (function () {
            const c = window.APP_BACKEND_CONFIG;

            window.APP_BACKEND = null;

            window.APP_BACKEND_READY = (async () => {

              if (c.provider === "supabase") {

                const s = document.createElement("script");

                s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";

                document.head.appendChild(s);

                await new Promise((resolve, reject) => {
                  s.onload = resolve;
                  s.onerror = reject;
                });

                window.APP_BACKEND =
                  window.supabase.createClient(
                    c.url,
                    c.publishable_key
                  );

              } else if (c.provider === "firebase") {

                const base =
                  "https://www.gstatic.com/firebasejs/10.14.1/";

                const load = (name) => new Promise((resolve, reject) => {

                  const s = document.createElement("script");

                  s.src = base + name + "-compat.js";

                  s.onload = resolve;
                  s.onerror = reject;

                  document.head.appendChild(s);
                });

                await load("firebase-app");

                window.APP_FIREBASE =
                  firebase.initializeApp(c.firebase);

                if (c.features?.auth)
                  await load("firebase-auth");

                if (c.features?.firestore)
                  await load("firebase-firestore");

                if (c.features?.storage)
                  await load("firebase-storage");

                if (c.features?.realtime_database)
                  await load("firebase-database");

                window.APP_BACKEND = {
                  app: window.APP_FIREBASE,

                  auth: c.features?.auth
                    ? firebase.auth() : null,

                  firestore: c.features?.firestore
                    ? firebase.firestore() : null,

                  storage: c.features?.storage
                    ? firebase.storage() : null,

                  database: c.features?.realtime_database
                    ? firebase.database() : null
                };
              }

              return window.APP_BACKEND;

            })();
          })();
          '''

          js = "window.APP_BACKEND_CONFIG=" + json.dumps(cfg) + ";\n" + js

          open(
              "project/www/builder-backend.js",
              "w"
          ).write(js)

          index = "project/www/index.html"

          page = open(index, encoding="utf-8").read()

          tag = '<script src="./builder-backend.js"></script>'

          if "builder-backend.js" not in page:

              pos = page.lower().rfind("</head>")

              if pos >= 0:
                  page = page[:pos] + tag + page[pos:]
              else:
                  page = tag + page

          open(index, "w", encoding="utf-8").write(page)

      - name: Install AdMob plugin
        if: steps.detect.outputs.type == 'web'
        run: |
          cd project

          if python3 -c \
            'import json; exit(0 if json.load(open("../manifest.json")).get("admob",{}).get("enabled") else 1)'
          then
            npm install @capacitor-community/admob@6
          fi

      - name: Generate AdMob configuration
        if: steps.detect.outputs.type == 'web'
        run: |
          set -euo pipefail

          cd project

          python3 - <<'PY'
          import json

          d = json.load(open("../manifest.json"))
          a = d.get("admob", {})

          cfg = {
              "enabled": bool(a.get("enabled")),
              "testing": bool(a.get("testing", True)),

              "app_id": a.get(
                  "app_id",
                  "ca-app-pub-3940256099942544~3347511713"
              ),

              "banner_id": a.get(
                  "banner_id",
                  "ca-app-pub-3940256099942544/6300978111"
              ),

              "interstitial_id": a.get(
                  "interstitial_id",
                  "ca-app-pub-3940256099942544/1033173712"
              ),

              "rewarded_id": a.get(
                  "rewarded_id",
                  "ca-app-pub-3940256099942544/5224354917"
              ),

              "banner_enabled": bool(a.get("banner_enabled", True)),
              "interstitial_enabled": bool(a.get("interstitial_enabled", True)),
              "rewarded_enabled": bool(a.get("rewarded_enabled", True)),

              "interstitial_frequency": max(
                  1,
                  int(a.get("interstitial_frequency", 3))
              )
          }

          json.dump(
              cfg,
              open("www/admob-config.json", "w")
          )

          open("www/admob-config.js", "w").write(
              "window.APP_ADMOB_CONFIG=" + json.dumps(cfg) + ";"
          )
          PY

          if python3 -c \
            'import json; exit(0 if json.load(open("../manifest.json")).get("admob",{}).get("enabled") else 1)'
          then

            cat > admob-entry.js <<'JS'
          import { AdMob } from "@capacitor-community/admob";

          const c = window.APP_ADMOB_CONFIG;

          let initialized = false;
          let pageCount = 0;

          async function init() {

            if (!c?.enabled || initialized)
              return false;

            await AdMob.initialize();

            let consent = await AdMob.requestConsentInfo();

            if (
              !consent.canRequestAds &&
              consent.isConsentFormAvailable
            ) {
              consent = await AdMob.showConsentForm();
            }

            if (!consent.canRequestAds)
              return false;

            initialized = true;

            if (c.banner_enabled)
              await banner();

            return true;
          }

          async function banner() {

            if (!initialized || !c.banner_enabled)
              return;

            await AdMob.showBanner({
              adId: c.banner_id,
              adSize: "ADAPTIVE_BANNER",
              position: "BOTTOM_CENTER",
              isTesting: c.testing
            });
          }

          async function interstitial() {

            if (!initialized || !c.interstitial_enabled)
              return false;

            pageCount++;

            if (pageCount % c.interstitial_frequency !== 0)
              return false;

            await AdMob.prepareInterstitial({
              adId: c.interstitial_id,
              isTesting: c.testing
            });

            await AdMob.showInterstitial();

            return true;
          }

          async function rewarded() {

            if (!initialized || !c.rewarded_enabled) {
              throw new Error(
                "Rewarded ads are not enabled or consent is unavailable"
              );
            }

            await AdMob.prepareRewardVideoAd({
              adId: c.rewarded_id,
              isTesting: c.testing
            });

            const result = await AdMob.showRewardVideoAd();

            window.dispatchEvent(
              new CustomEvent("builder:reward-earned", {
                detail: result
              })
            );

            return result;
          }

          window.BuilderAdMob = {

            initialize: init,

            showBanner: banner,

            showInterstitial: interstitial,

            showRewarded: rewarded,

            hideBanner: () => AdMob.hideBanner(),

            removeBanner: () => AdMob.removeBanner(),

            showPrivacyOptions: () =>
              AdMob.showPrivacyOptionsForm()
          };

          if (c?.enabled) {

            document.addEventListener(
              "DOMContentLoaded",
              () => {
                init().catch(
                  e => console.error("AdMob init:", e)
                );
              }
            );
          }
          JS

            npx --yes esbuild admob-entry.js \
              --bundle \
              --platform=browser \
              --format=iife \
              --outfile=www/admob-runtime.js

            python3 - <<'PY'
          import json

          d = json.load(open("../manifest.json"))

          if not d.get("admob", {}).get("enabled"):
              raise SystemExit(0)

          path = "www/index.html"

          page = open(path, encoding="utf-8").read()

          tag = (
              '<script src="./admob-config.js"></script>'
              '<script src="./admob-runtime.js"></script>'
          )

          if "admob-runtime.js" not in page:

              pos = page.lower().rfind("</body>")

              if pos >= 0:
                  page = page[:pos] + tag + page[pos:]
              else:
                  page += tag

          open(path, "w", encoding="utf-8").write(page)

          print("AdMob runtime and configuration injected")
          PY

          fi

      - name: Add Android platform
        if: steps.detect.outputs.type == 'web'
        run: |
          cd project

          npx cap add android

          npx cap sync android

      - name: Configure AdMob Android App ID
        if: steps.detect.outputs.type == 'web'
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          d = json.load(open("manifest.json"))
          a = d.get("admob", {})

          if not a.get("enabled"):
              print("AdMob disabled")
              raise SystemExit(0)

          app_id = a.get(
              "app_id",
              "ca-app-pub-3940256099942544~3347511713"
          )

          if not re.fullmatch(
              r"ca-app-pub-[0-9]+~[0-9]+",
              app_id
          ):
              raise SystemExit("Invalid AdMob App ID")

          root = Path("project/android/app/src/main")

          manifest = root / "AndroidManifest.xml"

          xml = manifest.read_text()

          meta = (
              '<meta-data '
              'android:name="com.google.android.gms.ads.APPLICATION_ID" '
              'android:value="@string/admob_app_id" />'
          )

          if "com.google.android.gms.ads.APPLICATION_ID" not in xml:

              xml = re.sub(
                  r"(<application\b[^>]*>)",
                  r"\1\n        " + meta,
                  xml,
                  count=1
              )

          manifest.write_text(xml)

          values = root / "res/values"

          values.mkdir(parents=True, exist_ok=True)

          strings = values / "strings.xml"

          if strings.exists():
              content = strings.read_text()
          else:
              content = (
                  '<?xml version="1.0" encoding="utf-8"?>'
                  '<resources></resources>'
              )

          item = (
              f'<string name="admob_app_id">{app_id}</string>'
          )

          if 'name="admob_app_id"' in content:

              content = re.sub(
                  r'<string name="admob_app_id">.*?</string>',
                  item,
                  content
              )

          else:
              content = content.replace(
                  "</resources>",
                  item + "</resources>"
              )

          strings.write_text(content)

          print("AdMob App ID configured")
          PY

      - name: Locate Android project
        id: android
        run: |
          set -euo pipefail

          if [ "${{ steps.detect.outputs.type }}" = "native" ]; then

            GRADLE="$(find project -name gradlew -type f \
              -not -path '*/node_modules/*' | head -n 1)"

            DIR="$(dirname "$GRADLE")"

          else

            DIR="project/android"

          fi

          test -f "$DIR/gradlew"

          chmod +x "$DIR/gradlew"

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build Debug APK
        run: |
          cd "${{ steps.android.outputs.dir }}"

          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          set -euo pipefail

          APK="$(find project -type f \
            -path '*/build/outputs/apk/*/*.apk' | head -n 1)"

          test -n "$APK"

          cp "$APK" output/app-debug.apk

          test -s output/app-debug.apk

          ls -lh output/app-debug.apk

      - name: Upload APK to GitHub Release
        run: |
          gh release upload "$RELEASE_TAG" \
            output/app-debug.apk \
            --repo "$GH_REPO" \
            --clobber

      - name: Delete source ZIP
        if: success()
        continue-on-error: true
        run: |
          gh release delete-asset "$RELEASE_TAG" source.zip \
            --repo "$GH_REPO" \
            --yes

      - name: Publish Release
        run: |
          gh release edit "$RELEASE_TAG" \
            --repo "$GH_REPO" \
            --draft=false \
            --prerelease=false

      - name: Build Summary
        if: always()
        run: |
          {
            echo "## Advanced APK Builder"
            echo "- Build ID: $RUN_ID"
            echo "- App: $APP_NAME"
            echo "- Package: $PACKAGE_ID"
            echo "- Version: $APP_VERSION"
            echo "- Build status: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
