
name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      app_name:
        description: "Application Name"
        required: true
        type: string
      package_id:
        description: "Package ID"
        required: true
        type: string
      html:
        description: "HTML Code Base64"
        required: true
        type: string
      css:
        description: "CSS Code Base64"
        required: false
        type: string
      js:
        description: "JavaScript Code Base64"
        required: false
        type: string
      branding_key:
        description: "Branding Key"
        required: false
        type: string
      ads_enabled:
        description: "Enable AdMob"
        required: false
        type: string
      admob_test_mode:
        description: "AdMob Test Mode"
        required: false
        type: string
      admob_app_id:
        description: "AdMob App ID"
        required: false
        type: string
      admob_banner_id:
        description: "AdMob Banner ID"
        required: false
        type: string
      admob_interstitial_id:
        description: "AdMob Interstitial ID"
        required: false
        type: string
      admob_rewarded_id:
        description: "AdMob Rewarded ID"
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Inputs
        shell: bash
        run: |
          if [ -z "$APP_NAME" ]; then
            echo "Application name is missing"
            exit 1
          fi
          if [[ ! "$PACKAGE_ID" =~ ^[a-zA-Z][a-zA-Z0-9_]*(\.[a-zA-Z][a-zA-Z0-9_]*)+$ ]]; then
            echo "Invalid package ID"
            exit 1
          fi
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare Web App
        shell: bash
        run: |
          mkdir -p www
          echo '${{ inputs.html }}' | base64 -d > www/index.html
          echo '${{ inputs.css }}' | base64 -d > /tmp/app.css
          echo '${{ inputs.js }}' | base64 -d > /tmp/app.js

          if [ -s /tmp/app.css ]; then
            printf '\n<style>\n' >> www/index.html
            cat /tmp/app.css >> www/index.html
            printf '\n</style>\n' >> www/index.html
          fi

          if [ -s /tmp/app.js ]; then
            printf '\n<script>\n' >> www/index.html
            cat /tmp/app.js >> www/index.html
            printf '\n</script>\n' >> www/index.html
          fi

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1
          npm install @capacitor/android@6.2.1

      - name: Configure Capacitor
        env:
          APP_NAME: ${{ inputs.app_name }}
          PACKAGE_ID: ${{ inputs.package_id }}
        run: |
          npx cap init "$APP_NAME" "$PACKAGE_ID" --web-dir www
          npx cap add android

      - name: Install AdMob Plugin
        if: ${{ inputs.ads_enabled == 'true' }}
        run: npm install @capacitor-community/admob@6

      - name: Prepare Branding
        if: ${{ inputs.branding_key != '' }}
        env:
          BRANDING_KEY: ${{ inputs.branding_key }}
        run: |
          mkdir -p assets
          if [ -f "branding/$BRANDING_KEY/icon.png" ]; then
            cp "branding/$BRANDING_KEY/icon.png" assets/icon.png
          fi
          if [ -f "branding/$BRANDING_KEY/splash.png" ]; then
            cp "branding/$BRANDING_KEY/splash.png" assets/splash.png
          fi
          if [ -f assets/icon.png ] || [ -f assets/splash.png ]; then
            npm install --save-dev @capacitor/assets@3
            npx capacitor-assets generate --android
          fi

      - name: Sync Android
        run: npx cap sync android

      - name: Configure Gradle
        run: |
          cd android
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
