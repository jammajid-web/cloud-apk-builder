name: chatwave
description: ChatWave native Flutter Android application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.8.4
  firebase_core: ^3.15.2
  firebase_messaging: ^15.2.10
  google_mobile_ads: ^5.3.1
  image_picker: ^1.2.1
  file_picker: ^10.3.7
  mime: ^2.0.0
  record: ^6.1.2
  audioplayers: ^6.5.1
  permission_handler: ^12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
