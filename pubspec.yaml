name: chatwave
description: ChatWave Flutter messaging application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  supabase_flutter: 2.8.4
  url_launcher: 6.3.2
  firebase_core: 3.15.2
  firebase_messaging: 15.2.10
  google_mobile_ads: 5.3.1
  image_picker: 1.2.1
  file_picker: 10.3.7
  mime: 2.0.0
  record: 6.1.2
  audioplayers: 6.5.1
  permission_handler: 12.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 5.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.6

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icon/chatwave.png
  min_sdk_android: 23

flutter_native_splash:
  color: '#0B1220'
  image: assets/splash/chatwave_splash.png
  android_12:
    color: '#0B1220'
    image: assets/splash/chatwave_splash.png
    icon_background_color: '#0B1220'
